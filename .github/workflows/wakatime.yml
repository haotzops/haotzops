name: Waka Readme

on:
  # for manual workflow trigger
  workflow_dispatch:
  schedule:
    # runs at 12 AM UTC (5:30 AM IST)
    - cron: "0 0 * * *"

jobs:
  update-readme:
    name: WakaReadme DevMetrics
    runs-on: ubuntu-latest
    steps:
        # 仓库内证书：Caddy internal CA 根证书（公开文件，无机密）
      - name: Checkout
        uses: actions/checkout@v4
      - name: Trust Wakapi internal CA
        run: |
          # 合并系统 CA 与仓库内 Caddy 根证书（REQUESTS_CA_BUNDLE 是替换而非追加，必须保留公共 CA）
          cat /etc/ssl/certs/ca-certificates.crt .github/certs/wakapi-root.crt > /tmp/ca-bundle.crt
          echo "REQUESTS_CA_BUNDLE=/tmp/ca-bundle.crt" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=/tmp/ca-bundle.crt" >> "$GITHUB_ENV"
          echo "CURL_CA_BUNDLE=/tmp/ca-bundle.crt" >> "$GITHUB_ENV"
        # this action name
      - uses: athul/waka-readme@master # do NOT replace with anything else
        with:
          GH_TOKEN: ${{ secrets.GH_TOKEN }} # optional if on profile readme
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }} # required
          ### meta
          API_BASE_URL: ${{ secrets.WAKAPI_URL }} # optional
          REPOSITORY: haotzops/haotzops # optional
          ### content
          SHOW_TITLE: true # optional
          SECTION_NAME: waka # optional
          BLOCKS: ⣀⣄⣤⣦⣶⣷⣿ # optional
          CODE_LANG: markdown # optional
          TIME_RANGE: last_7_days # optional
          LANG_COUNT: 6 # optional
          SHOW_TIME: true # optional
          SHOW_TOTAL: true # optional
          SHOW_MASKED_TIME: true # optional
          SHOW_LOC_CHART: False
          STOP_AT_OTHER: true # optional
          IGNORED_LANGUAGES: zig,git # optional
          ### commit
          COMMIT_MESSAGE: Updated waka-readme graph with new metrics # optional
          TARGET_BRANCH: main # optional
          TARGET_PATH: README.md # optional
          COMMITTER_NAME: GitHubActionBot # optional
          COMMITTER_EMAIL: action-bot@github.com # optional
          AUTHOR_NAME: zen1th # optional
          AUTHOR_EMAIL: niaopian4@gmail.com # optional
          # you can populate email-id with secrets instead
